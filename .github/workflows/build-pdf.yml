name: Build PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Tag builds (e.g. v1.2) -> Claude-Code-Cheatsheet_v1.2.pdf, otherwise Claude-Code-Cheatsheet.pdf
  OUTPUT: ${{ startsWith(github.ref, 'refs/tags/v') && format('Claude-Code-Cheatsheet_{0}.pdf', github.ref_name) || 'Claude-Code-Cheatsheet.pdf' }}
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc, WeasyPrint and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc weasyprint fonts-dejavu poppler-utils

      - name: Build PDF and HTML
        run: scripts/build.sh

      - name: Check outputs
        run: scripts/check.sh

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-cheatsheet-pdf
          path: ${{ env.OUTPUT }}
          if-no-files-found: error

      - name: Upload HTML site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: claude-code-cheatsheet-pdf

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Code Cheatsheet ${{ github.ref_name }}
          files: ${{ env.OUTPUT }}
          generate_release_notes: true
