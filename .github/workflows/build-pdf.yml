name: Build PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE: "Claude Code Cheatsheet.md"
  OUTPUT: "Claude-Code-Cheatsheet.pdf"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc weasyprint fonts-dejavu

      - name: Convert Markdown to PDF
        run: |
          pandoc "$SOURCE" \
            --from gfm \
            --standalone \
            --embed-resources \
            --metadata title="Claude Code Cheatsheet" \
            --css .github/pdf/style.css \
            --pdf-engine=weasyprint \
            --output "$OUTPUT"

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-cheatsheet-pdf
          path: ${{ env.OUTPUT }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: claude-code-cheatsheet-pdf

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Code Cheatsheet ${{ github.ref_name }}
          files: ${{ env.OUTPUT }}
          generate_release_notes: true
